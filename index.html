<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gig Jobs</title>

<style>
body { font-family: Arial; margin:0; background:#f5f6fa; }

header {
  background:#000; color:#fff;
  padding:15px 30px;
  display:flex; justify-content:space-between;
}

header a { color:#ccc; margin-left:10px; text-decoration:none; }

.search {
  text-align:center;
  padding:30px;
}

.search input {
  width:60%; padding:10px;
}

.search button {
  padding:10px 20px;
  background:black; color:white; border:none;
}

.container { padding:20px; }

.job {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}

.apply {
  background:green;
  color:white;
  padding:10px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h2>AI GigJobs</h2>
  <div>
    <a href="#">Jobs</a>
    <a href="#">Platforms</a>
  </div>
</header>

<div class="search">
  <h1>Browse High-Paying AI Jobs</h1>
  <input type="text" placeholder="Search jobs...">
  <button>Search</button>
</div>

<div class="container">

<div class="job">
  <div>
    <h3>Data Analyst</h3>
    <p>Remote</p>
    <p>$80–120/hour</p>
  </div>
  <a href="#" class="apply">Apply</a>
</div>

<div class="job">
  <div>
    <h3>Machine Learning Engineer</h3>
    <p>US</p>
    <p>$90/hour</p>
  </div>
  <a href="#" class="apply">Apply</a>
</div>

</div>

</body>
</html>
